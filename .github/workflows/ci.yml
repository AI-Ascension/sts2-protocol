name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify named gameplay contract artifacts
        run: |
          cmp artifacts/runtime-v3-gameplay/schema.json schemas/runtime-v3-gameplay.schema.json
          (cd artifacts/runtime-v3-gameplay && sha256sum -c SHA256SUMS)
          test "$(sha256sum schemas/coop-gameplay-v1.schema.json | cut -d' ' -f1)" = "2c34d013315fbf2e16de03dbe2bd4c43d4c13c744292548cc46ea960af5e1fa2"
          jq -e '.["$id"] == "sts2-runtime-v3-gameplay" and .additionalProperties == false' schemas/runtime-v3-gameplay.schema.json >/dev/null
          jq -e '.["$id"] == "sts2-coop-gameplay-v1" and .additionalProperties == false' schemas/coop-gameplay-v1.schema.json >/dev/null

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check repository metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Verify protocol artifact checksums
        working-directory: artifacts/poc-v1
        run: sha256sum -c SHA256SUMS

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
