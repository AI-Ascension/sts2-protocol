name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify named gameplay contract artifacts
        run: |
          cmp artifacts/runtime-v3-gameplay/schema.json schemas/runtime-v3-gameplay.schema.json
          (cd artifacts/runtime-v3-gameplay && sha256sum -c SHA256SUMS)
          cmp artifacts/coop-synchronization-v1/schema.json schemas/coop-synchronization-v1.schema.json
          (cd artifacts/coop-synchronization-v1 && sha256sum -c SHA256SUMS)
          jq -e '.["$id"] == "sts2-runtime-v3-gameplay" and .additionalProperties == false' schemas/runtime-v3-gameplay.schema.json >/dev/null
          jq -e '.["$id"] == "sts2-coop-synchronization-v1" and .additionalProperties == false' schemas/coop-synchronization-v1.schema.json >/dev/null
          cmp artifacts/seeded-run-v1/schema.json schemas/seeded-run-v1.schema.json
          jq -e '.["$id"] == "sts2-seeded-run-v1"' schemas/seeded-run-v1.schema.json >/dev/null

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check repository metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Verify every protocol artifact inventory
        run: |
          set -euo pipefail
          inventory_count=0
          while IFS= read -r -d '' artifact; do
            test -s "$artifact/SHA256SUMS"
            (cd "$artifact" && sha256sum --strict -c SHA256SUMS)
            inventory_count=$((inventory_count + 1))
          done < <(find artifacts -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          test "$inventory_count" -gt 0

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install conformance Node runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.16.0'

      - name: Verify recorded-run candidate
        run: |
          node --test tools/recorded-run/*.test.mjs
          node --test tools/consumer-compatibility/*.test.mjs
          cmp schemas/recorded-run-bundle-v1.schema.json artifacts/recorded-run-bundle-v1/schema.json
          (cd artifacts/recorded-run-bundle-v1 && sha256sum -c SHA256SUMS)
          cmp schemas/recorded-run-bundle-v1-candidate3.schema.json artifacts/recorded-run-bundle-v1-candidate3/schema.json
          (cd artifacts/recorded-run-bundle-v1-candidate3 && sha256sum -c SHA256SUMS)

      - name: Verify pinned protocol consumer wire contracts
        run: node tools/consumer-compatibility/verify.mjs

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked
