name: Continuous integration

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check working tree and committed patch whitespace
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git diff --check
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ && "$BASE_REVISION" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_REVISION" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Verify named gameplay contract artifacts
        run: |
          cmp artifacts/runtime-v3-gameplay/schema.json schemas/runtime-v3-gameplay.schema.json
          (cd artifacts/runtime-v3-gameplay && sha256sum -c SHA256SUMS)
          cmp artifacts/coop-synchronization-v1/schema.json schemas/coop-synchronization-v1.schema.json
          (cd artifacts/coop-synchronization-v1 && sha256sum -c SHA256SUMS)
          jq -e '.["$id"] == "sts2-runtime-v3-gameplay" and .additionalProperties == false' schemas/runtime-v3-gameplay.schema.json >/dev/null
          jq -e '.["$id"] == "sts2-coop-synchronization-v1" and .additionalProperties == false' schemas/coop-synchronization-v1.schema.json >/dev/null

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check repository metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Verify protocol artifact checksums
        working-directory: artifacts/poc-v1
        run: sha256sum -c SHA256SUMS

      - name: Verify Runtime-v1 artifact checksums
        working-directory: artifacts/runtime-v1
        run: sha256sum -c SHA256SUMS

      - name: Verify Runtime-v2 artifact checksums
        working-directory: artifacts/runtime-v2
        run: sha256sum -c SHA256SUMS

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Enforce repository policy
        run: cargo run --locked --package repo-policy -- --strict

      - name: Validate adopted standards bundle
        run: cargo run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root .

      - name: Enforce production restrictions through Clippy
        run: cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings -F clippy::unwrap_used -F clippy::expect_used -F clippy::panic -F clippy::todo -F clippy::unimplemented

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run Rust documentation tests
        run: cargo test --workspace --all-features --doc --locked
